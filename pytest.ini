[pytest]
# Phase packages (p3..p11) keep their tests next to the code; root-level tests live in tests/.
# `pythonpath = .` makes the flat root modules (rppg_core, rppg_benchmark, ...) importable.
pythonpath = .
testpaths = tests p3_spatial p4_reliability p5_neural p6_temporal p7_self_supervised p8_multitask p9_domain_generalization p10_stress_lab p11_validation
# tests/manual = scripts that execute at import time and need a camera/model/Windows paths: never collect them.
norecursedirs = tests/manual archive Dataset_rPPG-10 models benchmark_results docs scripts .serena D:
